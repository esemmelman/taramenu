<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tara Menu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .app.service-mode {
      grid-template-columns: 220px 190px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
      background: #172033;
      box-shadow: 4px 0 18px rgb(15 23 42 / 12%);
    }

    .sidebar label {
      display: block;
      margin-bottom: 9px;
      color: #dbe4f0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    #page-list {
      width: 100%;
      min-height: 130px;
      padding: 6px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #fff8c5;
      color: #172033;
      font: inherit;
      cursor: pointer;
    }

    #page-list option {
      padding: 10px 8px;
    }

    #page-list:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    .revision {
      margin: 10px 0 0;
      color: #94a3b8;
      font-size: 0.75rem;
      text-align: center;
    }

    .slide-sidebar {
      display: none;
      height: 100vh;
      overflow-y: auto;
      padding: 14px 10px;
      background: #e2e8f0;
      border-right: 1px solid #cbd5e1;
    }

    .service-mode .slide-sidebar {
      display: block;
    }

    .slide-sidebar h2 {
      margin: 0 4px 10px;
      font-size: 0.82rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .slide-list {
      display: grid;
      gap: 10px;
    }

    .slide-button {
      display: block;
      width: 100%;
      padding: 5px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #fff8c5;
      color: #172033;
      cursor: pointer;
      font: inherit;
      text-align: left;
      box-shadow: 0 2px 7px rgb(15 23 42 / 10%);
    }

    .slide-button:hover {
      border-color: #93c5fd;
    }

    .slide-button.active {
      border-color: #2563eb;
    }

    .slide-button:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    .slide-number {
      display: block;
      padding: 10px 6px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }

    .content {
      display: flex;
      justify-content: center;
      padding: 20px;
      min-width: 0;
    }

    #page-frame {
      width: min(100%, 1200px);
      min-height: calc(100vh - 40px);
      border: 0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }

    .service-panel {
      display: flex;
      width: min(100%, 1200px);
      height: calc(100vh - 40px);
      min-height: 400px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }
    .service-panel[hidden] { display: none; }
    .service-left-rail {
      flex: 0 0 22%;
      display: grid;
      place-items: start center;
      padding-top: 35px;
      min-width: 0;
    }
    .service-image {
      flex: 0 0 56%;
      width: 56%;
      height: 100%;
      object-fit: contain;
      object-position: top left;
      background: #fff;
    }
    .service-rail {
      display: grid;
      flex: 1;
      place-items: start center;
      min-width: 0;
      padding-top: 35px;
    }

    .service-recording {
      position: relative;
      width: max-content;
      padding: 5px;
      border-radius: 10px;
      background: #fff8c5;
      box-shadow: 0 4px 18px rgb(15 23 42 / 25%);
    }
    .service-recording[hidden] { display: none; }
    .service-recording button { padding: 7px 12px; cursor: pointer; }
    .service-playback { max-width: 100%; text-align: center; }
    .service-playback[hidden] { display: none; }
    .service-playback button { padding: 7px 12px; cursor: pointer; }
    .service-play-button-wrap { display: inline-block; padding: 5px; border-radius: 10px; background: #fff8c5; box-shadow: 0 4px 18px rgb(15 23 42 / 25%); }
    .service-playback-bar { width: 100%; margin-top: 12px; padding: 0 8px; box-sizing: border-box; color: white; font-size: 0.8rem; }
    .service-playback-bar[hidden] { display: none; }
    .service-playback-bar input { display: block; width: 100%; margin: 0 0 5px; accent-color: #e5bd29; cursor: pointer; }
    .service-playback p { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .homework-panel {
      width: min(100%, 900px);
      min-height: calc(100vh - 40px);
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
    }

    .homework-panel[hidden] {
      display: none;
    }

    .torah-panel {
      width: min(100%, 900px);
      min-height: calc(100vh - 40px);
      padding: 32px clamp(24px, 5vw, 60px);
      overflow-y: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    .torah-panel[hidden] {
      display: none;
    }

    .torah-panel h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .torah-reference {
      margin: 4px 0 28px;
      color: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .torah-chapter {
      margin: 32px 0 12px;
      font-size: 1.4rem;
    }

    .torah-verse {
      margin: 0 0 0.8em;
      font-size: 1.1rem;
    }

    .verse-number {
      margin-right: 0.35em;
      color: #475569;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72em;
      font-weight: 700;
      vertical-align: super;
    }

    .torah-verse.highlighted {
      padding: 3px 7px;
      border-radius: 4px;
      background: #fff176;
    }

    .torah-status {
      color: #475569;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid #cbd5e1;
      background: #f8fafc;
    }

    .editor-toolbar button {
      min-width: 38px;
      padding: 7px 10px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      background: #fff8c5;
      color: #172033;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .editor-toolbar button:hover {
      background: #fef08a;
    }

    .sync-status {
      margin-left: auto;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
    }

    #homework-editor {
      min-height: calc(100vh - 102px);
      padding: 28px;
      outline: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.65;
    }

    #homework-editor:empty::before {
      color: #94a3b8;
      content: "Enter homework here…";
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .app {
        grid-template-columns: 150px minmax(0, 1fr);
      }

      .app.service-mode {
        grid-template-columns: 150px 125px minmax(320px, 1fr);
        overflow-x: auto;
      }

      .sidebar,
      .content {
        padding: 10px;
      }

      .slide-sidebar {
        padding: 10px 6px;
      }

      #page-frame {
        min-height: calc(100vh - 20px);
      }

      .service-panel { height: calc(100vh - 20px); }
      .service-recording button { padding: 6px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <label for="page-list">Menu</label>
      <select id="page-list" size="8" aria-label="Choose a page">
        <option value="timeline/">Timeline</option>
        <option value="torah/" selected>Torah Reading</option>
        <option value="service">Service</option>
        <option value="https://esemmelman.github.io/Elohai-Neshama/">Elohai</option>
        <option value="torah-portion">Portion in English</option>
        <option value="haftorah/">Haftorah Reading</option>
        <option value="homework">Homework</option>
      </select>
      <p class="revision">Revision 1.0.1</p>
    </aside>

    <aside id="slide-sidebar" class="slide-sidebar" aria-label="Service slides">
      <h2>Service pages</h2><p><a href="service.pdf" target="_blank" rel="noopener">Open service PDF</a></p>
      <div id="slide-list" class="slide-list"></div>
    </aside>

    <section class="content" aria-label="Selected page">
      <iframe
        id="page-frame"
        title="Torah Reading"
        src="torah/"
        loading="eager"
        allow="camera; microphone; autoplay; fullscreen; display-capture"
      ></iframe>

      <div id="service-panel" class="service-panel" hidden>
        <div class="service-left-rail">
          <div id="service-recording" class="service-recording" hidden>
            <button id="service-record-button" type="button" aria-pressed="false">Record</button>
          </div>
        </div>
        <img id="service-image" class="service-image" alt="">
        <div class="service-rail">
          <div id="service-playback" class="service-playback" hidden>
            <div class="service-play-button-wrap">
              <button id="service-play-button" type="button" disabled>Play</button>
            </div>
            <div id="service-playback-bar" class="service-playback-bar" hidden>
              <input id="service-playback-seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Recording position" disabled>
              <span id="service-playback-time">0:00 / 0:00</span>
            </div>
            <p id="service-playback-status" role="status"></p>
          </div>
        </div>
      </div>

      <article id="torah-panel" class="torah-panel" aria-labelledby="torah-title" hidden>
        <h1 id="torah-title">Vaera</h1>
        <p class="torah-reference">
          Exodus 6:2–9:35 ·
          <a href="https://www.sefaria.org/Exodus.6.2-9.35?lang=en" target="_blank" rel="noopener">JPS · English text from the supplied photographs</a>
          · Missing text supplemented from Sefaria
        </p>
        <div id="torah-text" aria-live="polite">
          <p class="torah-status">Loading Torah portion…</p>
        </div>
      </article>

      <div id="homework-panel" class="homework-panel" hidden>
        <div class="editor-toolbar" role="toolbar" aria-label="Homework formatting">
          <button type="button" data-command="bold" aria-label="Bold"><strong>B</strong></button>
          <button type="button" data-command="italic" aria-label="Italic"><em>I</em></button>
          <button type="button" data-command="underline" aria-label="Underline"><u>U</u></button>
          <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list">• List</button>
          <button type="button" data-command="insertOrderedList" aria-label="Numbered list">1. List</button>
          <span id="sync-status" class="sync-status" aria-live="polite">Loading…</span>
        </div>
        <div
          id="homework-editor"
          contenteditable="true"
          role="textbox"
          aria-label="Homework"
          aria-multiline="true"
        ></div>
      </div>
    </section>
  </main>

  <script>
    const supabaseUrl = "https://fgomaujsdblpzxhnnqrg.supabase.co";
    const supabaseKey = "sb_publishable_JOUqLZDnfGu_yCa6k6FVDQ_AYwpr72i";
    const homeworkEndpoint = `${supabaseUrl}/rest/v1/taramenu_homework_documents?document_key=eq.homework`;
    const serviceSlides = [
  {
    "id": "page-1",
    "page": "1",
    "title": "Page 1"
  },
  {
    "id": "page-2",
    "page": "2",
    "title": "Page 2"
  },
  {
    "id": "page-3",
    "page": "3",
    "title": "Page 3"
  },
  {
    "id": "page-4",
    "page": "4",
    "title": "Page 4"
  },
  {
    "id": "page-5",
    "page": "5",
    "title": "Page 5"
  },
  {
    "id": "page-6",
    "page": "6",
    "title": "Page 6"
  },
  {
    "id": "page-7",
    "page": "7",
    "title": "Page 7"
  },
  {
    "id": "page-8",
    "page": "8",
    "title": "Page 8"
  },
  {
    "id": "page-9",
    "page": "9",
    "title": "Page 9"
  },
  {
    "id": "page-10",
    "page": "10",
    "title": "Page 10"
  },
  {
    "id": "page-11",
    "page": "11",
    "title": "Page 11"
  },
  {
    "id": "page-12",
    "page": "12",
    "title": "Page 12"
  },
  {
    "id": "page-13",
    "page": "13",
    "title": "Page 13"
  }
];
    const recordableSlideIds = new Set(serviceSlides.map(slide => slide.id));
    const app = document.querySelector(".app");
    const pageList = document.querySelector("#page-list");
    const pageFrame = document.querySelector("#page-frame");
    const slideList = document.querySelector("#slide-list");
    const servicePanel = document.querySelector("#service-panel");
    const serviceImage = document.querySelector("#service-image");
    const serviceRecording = document.querySelector("#service-recording");
    const torahPanel = document.querySelector("#torah-panel");
    const torahText = document.querySelector("#torah-text");
    const homeworkPanel = document.querySelector("#homework-panel");
    const homeworkEditor = document.querySelector("#homework-editor");
    const syncStatus = document.querySelector("#sync-status");
    let homeworkLoaded = false;
    let torahLoaded = false;
    let homeworkDirty = false;
    let homeworkUpdatedAt = "";
    let saveTimer;

    const supabaseHeaders = {
      apikey: supabaseKey,
      Authorization: `Bearer ${supabaseKey}`,
      "Content-Type": "application/json"
    };

    async function loadHomework() {
      try {
        const response = await fetch(`${homeworkEndpoint}&select=content_html,updated_at`, {
          headers: supabaseHeaders,
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`Load failed (${response.status})`);
        const [documentRow] = await response.json();
        if (!homeworkDirty && documentRow && documentRow.updated_at !== homeworkUpdatedAt) {
          homeworkEditor.innerHTML = documentRow.content_html;
          homeworkUpdatedAt = documentRow.updated_at;
        }
        homeworkLoaded = true;
        syncStatus.textContent = "Synced";
      } catch (error) {
        syncStatus.textContent = "Unable to sync";
        console.error(error);
      }
    }

    async function saveHomework() {
      if (!homeworkDirty) return;
      syncStatus.textContent = "Saving…";
      try {
        const response = await fetch(homeworkEndpoint, {
          method: "PATCH",
          headers: { ...supabaseHeaders, Prefer: "return=representation" },
          body: JSON.stringify({
            content_html: homeworkEditor.innerHTML,
            updated_at: new Date().toISOString()
          })
        });
        if (!response.ok) throw new Error(`Save failed (${response.status})`);
        const [documentRow] = await response.json();
        homeworkUpdatedAt = documentRow.updated_at;
        homeworkDirty = false;
        syncStatus.textContent = "Saved and synced";
      } catch (error) {
        syncStatus.textContent = "Save failed — retrying";
        console.error(error);
        saveTimer = setTimeout(saveHomework, 3000);
      }
    }

    homeworkEditor.addEventListener("input", () => {
      homeworkDirty = true;
      syncStatus.textContent = "Unsaved changes";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveHomework, 800);
    });

    document.querySelectorAll("[data-command]").forEach((button) => {
      button.addEventListener("mousedown", (event) => event.preventDefault());
      button.addEventListener("click", () => {
        homeworkEditor.focus();
        document.execCommand(button.dataset.command, false);
        homeworkEditor.dispatchEvent(new Event("input"));
      });
    });

    setInterval(() => {
      if (!homeworkPanel.hidden && homeworkLoaded && !homeworkDirty) loadHomework();
    }, 5000);



    async function loadTorahPortion() {
      if (torahLoaded) return;

      torahText.innerHTML = '<p class="torah-status">Loading Torah portion…</p>';
      try {
        const response = await fetch('data/vaera.json');
        if (!response.ok) throw new Error('Unable to load Vaera');
        const chapters = await response.json();
        torahText.replaceChildren();
        chapters.forEach(({ chapter, verses }) => {
          const heading = document.createElement('h2');
          heading.className = 'torah-chapter';
          heading.textContent = `Exodus ${chapter}`;
          torahText.append(heading);
          verses.forEach(({ verse, text }) => {
            const paragraph = document.createElement('p');
            paragraph.className = 'torah-verse';
            paragraph.dataset.chapter = chapter;
            paragraph.dataset.verse = verse;
            if (chapter === 8 && verse >= 1 && verse <= 15) paragraph.classList.add('highlighted');
            const number = document.createElement('span');
            number.className = 'verse-number';
            number.textContent = verse;
            paragraph.append(number, document.createTextNode(text));
            torahText.append(paragraph);
          });
        });
        torahLoaded = true;
      } catch (error) {
        torahText.innerHTML = '<p class="torah-status">The Torah portion could not be loaded. Please check your connection and try again.</p>';
        console.error(error);
      }
    }

    function selectSlide(button, slide) {
      window.stopServiceRecording?.();
      serviceRecording.hidden = true;
      document.querySelectorAll(".slide-button").forEach((item) => {
        item.classList.toggle("active", item === button);
        item.setAttribute("aria-current", item === button ? "true" : "false");
      });
      serviceImage.dataset.slideId = slide.id;
      serviceImage.onload = () => {
        if (pageList.value === "service" && serviceImage.dataset.slideId === slide.id) {
          serviceRecording.hidden = !recordableSlideIds.has(slide.id);
        }
      };
      serviceImage.src = `service-slides/${slide.id}.png?v=1.0.0`;
      serviceImage.alt = `Service — ${slide.title}`;
      window.servicePassageTitle = slide.title;
      window.showServicePlayback?.(slide.id);
      pageFrame.title = slide.title
        ? `Service — ${slide.title}`
        : slide.page
          ? `Service — page ${slide.page}`
          : "Service — final slide";
    }

    serviceSlides.forEach((slide, index) => {
      const button = document.createElement("button");
      const slideNumber = index + 1;
      const slideLabel = slide.title || (slide.page ? `Page ${slide.page}` : "Final slide");
      button.type = "button";
      button.className = "slide-button";
      button.dataset.slideNumber = slideNumber;
      button.innerHTML = `
        <span class="slide-number">${slideLabel}</span>
      `;
      button.addEventListener("click", () => selectSlide(button, slide));
      slideList.append(button);
    });

    pageList.addEventListener("change", () => {
      const selected = pageList.options[pageList.selectedIndex];
      const isService = selected.value === "service";
      window.showServicePlayback?.(null);
      const isHomework = selected.value === "homework";
      const isTorahPortion = selected.value === "torah-portion";
      app.classList.toggle("service-mode", isService);
      if (!isService) window.stopServiceRecording?.();
      serviceRecording.hidden = true;
      servicePanel.hidden = !isService;
      pageFrame.hidden = isHomework || isTorahPortion || isService;
      homeworkPanel.hidden = !isHomework;
      torahPanel.hidden = !isTorahPortion;

      if (isService) {
        const firstSlide = document.querySelector(".slide-button");
        selectSlide(firstSlide, serviceSlides[0]);
      } else if (isHomework) {
        loadHomework();
        homeworkEditor.focus();
      } else if (isTorahPortion) {
        loadTorahPortion();
      } else {
        pageFrame.src = selected.value;
        pageFrame.title = selected.text;
      }
    });
  </script>
  <script src="service-recordings.js?v=1.0.0"></script>
</body>
</html>
